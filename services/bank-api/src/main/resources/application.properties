spring.application.name=mock-bank
server.port=8080
server.servlet.session.timeout=20m

# The React build is packaged into classpath:/static by Maven. When the app is started from an
# IDE (which skips that step), fall back to the last `npm run build` output in frontend/dist,
# whether the working directory is the repository root or services/bank-api.
spring.web.resources.static-locations=classpath:/static/,file:./frontend/dist/,file:../../frontend/dist/

# PostgreSQL (docker compose up postgres). Override with DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mockbank}
spring.datasource.username=${DB_USERNAME:mockbank}
spring.datasource.password=${DB_PASSWORD:mockbank}

# Flyway owns the schema; Hibernate only checks that the entities still match it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Audit events are published to Kafka after each audit row commits.
mockbank.kafka.enabled=${KAFKA_ENABLED:true}
mockbank.kafka.audit-topic=mockbank.audit-events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Fail fast instead of blocking a UI request for 60s when the broker is down.
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000

management.endpoints.web.exposure.include=health,info

# API docs: Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
