# Weekly dependency update PRs. Minor and patch bumps are grouped into one PR per ecosystem;
# major versions arrive as separate PRs so they can be reviewed on their own.
version: 2

updates:
  - package-ecosystem: maven
    directories: ["/", "/audit-consumer"]
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /automation
    schedule:
      interval: weekly
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: ["/", "/audit-consumer"]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
