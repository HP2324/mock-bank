name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: mock-bank (unit + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Testcontainers starts PostgreSQL and Kafka using the runner's Docker engine.
      - run: ./mvnw -B -DskipFrontend verify

  audit-consumer:
    name: audit-consumer (unit + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B -f audit-consumer/pom.xml verify

  frontend:
    name: frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  automation:
    name: automation (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  e2e:
    name: Docker Compose stack + artifact replay on Linux
    needs: [backend, audit-consumer, frontend, automation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL, Kafka, mock-bank and audit-consumer
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/pyproject.toml
      - name: Install automation and Chromium
        working-directory: automation
        run: |
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Replay saved capability artifacts against the React UI
        working-directory: automation
        run: python scripts/replay_smoke.py --base-url http://localhost:8080 --evidence-dir "$RUNNER_TEMP/evidence"
      - name: Audit events reached the consumer through Kafka
        run: |
          for attempt in $(seq 1 30); do
            summary=$(curl -fsS http://localhost:8081/api/events/summary || true)
            if echo "$summary" | grep -q SUBACCOUNT_OPENED; then echo "$summary"; exit 0; fi
            sleep 2
          done
          echo "audit-consumer never received SUBACCOUNT_OPENED: $summary"; exit 1
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v
