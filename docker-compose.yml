# Full stack: PostgreSQL, Kafka (KRaft, no ZooKeeper), mock-bank (UI + API) and audit-consumer.
#
#   docker compose up -d --build --wait     # everything, then open http://localhost:8080
#   docker compose up -d postgres kafka     # just infrastructure, for `mvn spring-boot:run`
#   docker compose down -v                  # stop and reset all data back to the seed state
#
# Ports bind to 127.0.0.1 only, so on a cloud VM nothing is public unless you choose to expose
# it (see deploy/ec2/README.md).
name: mock-bank

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mockbank
      POSTGRES_USER: mockbank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mockbank}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockbank -d mockbank"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL is for containers on this network; EXTERNAL is for apps run on the host.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  mock-bank:
    build: .
    image: mock-bank:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mockbank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mockbank}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:8080:8080"

  audit-consumer:
    build: ./audit-consumer
    image: mock-bank-audit-consumer:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/audit_consumer
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mockbank}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  postgres-data:
  kafka-data:
